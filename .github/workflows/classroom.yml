name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: md 형식 검사
      id: md
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: md 형식 검사
        setup-command: ''
        command: bash .github/scripts/test_md_check.sh
        timeout: 1
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        MD_RESULTS: "${{steps.md.outputs.result}}"
      with:
        runners: md
